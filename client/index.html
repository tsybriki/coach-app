<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <title>Coach App</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- Шапка приложения: заголовок экрана или кнопка «назад» -->
  <header class="appbar" id="appbar"></header>

  <!-- Основной экран -->
  <main class="app" id="picker"></main>

  <!-- Детали тренировки — второй уровень, перекрывают основной экран -->
  <main class="app hidden" id="cardWrap">
    <div id="cardHost"></div>
  </main>

  <!-- Разбор выполненной тренировки — третий уровень -->
  <main class="app hidden" id="detailWrap">
    <div id="detailHost"></div>
  </main>

  <!-- Нижняя навигация -->
  <nav class="bottomnav" id="nav"></nav>

  <script type="module" src="/app.js"></script>
</body>
</html>
